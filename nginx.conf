# ============================================================
#  AchMarket – Nginx reverse proxy (same VPS as AchSwap)
#  Place at: /etc/nginx/sites-available/achmarket
#  Then:
#    sudo ln -s /etc/nginx/sites-available/achmarket /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#  SSL:
#    sudo certbot --nginx -d market.yourdomain.trade -d yourdomain.trade
#  (Use your real market hostname below.)
# ============================================================

# If these zones already exist in the AchSwap nginx config, delete these two
# lines here to avoid "duplicate limit_req_zone" errors.
limit_req_zone $binary_remote_addr zone=achmarket_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=achmarket_web:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    # Change to your market hostname, e.g. market.achswap.trade
    server_name market.yourdomain.trade;

    client_max_body_size 20m;

    location /api/ {
        limit_req zone=achmarket_api burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        limit_req zone=achmarket_web burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|webp)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/plain application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;
}
