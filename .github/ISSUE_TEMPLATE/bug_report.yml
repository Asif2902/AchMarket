name: Bug report
description: Report a bug in AchMarket
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: prediction.achswap.app, browser, wallet, network
