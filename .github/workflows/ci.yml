# AchMarket — continuous integration (open-source gate)
name: CI

on:
  push:
    branches: [hoster, main, master, heroku]
  pull_request:
    branches: [hoster, main, master, heroku]
  workflow_dispatch:

concurrency:
  group: ci-achmarket-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Hardhat compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install root deps
        run: npm ci
      - name: Compile contracts
        run: npm run compile

  backend:
    name: Backend typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend
        run: npm ci --prefix backend
      - name: Typecheck
        run: npm --prefix backend run typecheck
      - name: Build
        run: npm --prefix backend run build
      - name: Artifact exists
        run: test -f backend/dist/server.js

  frontend:
    name: Frontend typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci --prefix frontend
      - name: Typecheck
        run: npm --prefix frontend run typecheck
      - name: Build
        env:
          VITE_WALLETCONNECT_PROJECT_ID: ci-placeholder
        run: npm --prefix frontend run build
      - name: Artifact exists
        run: test -f frontend/dist/index.html

  deploy-scripts:
    name: Deploy CLI syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: bash -n all deploy scripts
        run: |
          set -e
          bash -n deploy.sh
          bash -n up.sh
          for f in scripts/deploy/*.sh scripts/deploy/lib/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done
      - name: CLI help
        run: |
          chmod +x deploy.sh up.sh scripts/deploy/*.sh scripts/deploy/lib/*.sh
          ./deploy.sh help | head -40
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: scripts/deploy
        continue-on-error: true
